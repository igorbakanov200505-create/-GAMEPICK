<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GAMEPICK V10 · OBS</title>
<style>
:root{--accent:#71e6fa;--accent-dark:#253a61;color-scheme:dark}*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;background:transparent!important;color:#fff;overflow:hidden;font:600 20px/1.45 system-ui,Arial,sans-serif}main{width:100%;height:100%;display:flex;align-items:center;justify-content:center;padding:5vw}.widget{width:min(1050px,94vw);max-height:96vh;overflow:hidden;padding:clamp(22px,4vw,56px);background:linear-gradient(135deg,#0b1325ed,#0b1226ef);border:2px solid var(--accent);border-radius:24px;box-shadow:0 0 52px #000a,0 0 40px color-mix(in srgb,var(--accent) 30%,transparent);position:relative}.widget:before{content:"";height:4px;background:var(--accent);position:absolute;left:0;right:0;top:0}.top{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--accent);font-weight:900;letter-spacing:3px;margin-bottom:15px}.title{font-size:clamp(28px,5.1vw,75px);line-height:1.13;letter-spacing:-1.5px;margin:5px 0 13px;overflow-wrap:anywhere}.subtitle{color:#c1cad9;font-size:clamp(14px,2vw,23px)}.split{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:28px}.block{border:1px solid #52617d9e;border-radius:14px;padding:15px;background:#ffffff09;min-width:0}.block small{display:block;color:var(--accent);font-size:12px;letter-spacing:2px;font-weight:900;margin-bottom:8px}.block strong{display:block;font-size:clamp(20px,2.7vw,34px);overflow-wrap:anywhere}.spin-visual{display:flex;align-items:center;justify-content:center;gap:30px}.disc{width:clamp(100px,19vw,210px);height:clamp(100px,19vw,210px);border:10px solid var(--accent);border-radius:50%;box-shadow:inset 0 0 40px color-mix(in srgb,var(--accent) 30%,transparent),0 0 30px color-mix(in srgb,var(--accent) 30%,transparent);position:relative;animation:spin 1.15s linear infinite}.disc:before,.disc:after{content:"";position:absolute;background:var(--accent)}.disc:before{height:10px;left:0;right:0;top:50%;transform:rotate(45deg)}.disc:after{width:10px;top:0;bottom:0;left:50%;transform:rotate(35deg)}@keyframes spin{to{transform:rotate(360deg)}}.clock{font-size:clamp(70px,15vw,180px);font-weight:1000;color:var(--accent);letter-spacing:-8px;line-height:1}.progress{margin-top:20px;width:100%;height:13px;background:#ffffff22;border-radius:30px;overflow:hidden}.progress i{display:block;height:100%;width:0;background:var(--accent);border-radius:30px;transition:width .2s linear}.history{list-style:none;margin:14px 0 0;padding:0}.history li{display:flex;align-items:center;gap:15px;border-top:1px solid #ffffff22;padding:11px 0;overflow-wrap:anywhere}.history b{font-size:13px;color:var(--accent)}.votes{display:grid;gap:13px;margin-top:22px}.vote{display:grid;gap:5px}.vote label{display:flex;justify-content:space-between;gap:12px;font-size:16px;overflow-wrap:anywhere}.vote-track{height:10px;background:#ffffff22;overflow:hidden;border-radius:8px}.vote-track i{display:block;height:100%;background:var(--accent);border-radius:8px;transition:width .35s ease}.result-name{color:var(--accent)}.card-body{display:flex;gap:25px;align-items:center}.cover{width:clamp(84px,15vw,170px);aspect-ratio:460/215;object-fit:cover;border-radius:10px;background:#16243b}.hidden{display:none!important}.note{color:#d7dcfa;font-size:13px;margin-top:20px}.footer{color:#a6b4cc;font-size:12px;letter-spacing:2px;margin-top:22px}.spark{color:var(--accent)}@media(max-width:700px){.split{grid-template-columns:1fr}.card-body{flex-direction:column;align-items:start}.spin-visual{flex-direction:column}.widget{padding:20px}}@media(prefers-reduced-motion:reduce){.disc{animation-duration:5s}}
</style></head><body><main id="main"><section class="widget" id="widget"><div class="top"><span>✦ GAMEPICK STUDIO V10</span><span id="headMode">OBS</span></div><div id="content" aria-live="polite"><h1 class="title">ГОТОВ К ЭФИРУ</h1><p class="subtitle">Запусти рулетку на основном сайте</p></div><div class="footer" id="foot">GAMEPICK / STREAM</div></section></main>
<script>
(()=>{
 const qs=new URLSearchParams(location.search);const widget=['spin','result','triple','timer','history','vote'].includes(qs.get('widget'))?qs.get('widget'):'spin';
 const room=qs.get('room')||'';const valid=/^[a-f0-9]{32}$/.test(room);const preview=qs.get('preview')==='1';
 const accents={neon:'#71e6fa',noir:'#ff526d',sunset:'#ffad75',retro:'#eacb5a',frost:'#89bdff',forest:'#80e8b4',gold:'#f6d47e',cosmos:'#ba9bff'};
 const theme=qs.get('theme');const color=qs.get('accent');document.documentElement.style.setProperty('--accent',/^#[0-9a-f]{6}$/i.test(color||'')?color:accents[theme]||accents.neon);
 const root=document.getElementById('content'),head=document.getElementById('headMode');head.textContent=' / '+({spin:'АНИМАЦИЯ',result:'РЕЗУЛЬТАТ',triple:'ТРОЙНОЙ ВЫБОР',timer:'ТАЙМЕР',history:'ИСТОРИЯ',vote:'ГОЛОСОВАНИЕ'}[widget]);
 const el=(tag,cl,text)=>{const n=document.createElement(tag);if(cl)n.className=cl;if(text!==undefined)n.textContent=String(text);return n};
 const append=(...nodes)=>root.append(...nodes);
 function clear(){root.replaceChildren()}
 function heading(title,subtitle){append(el('h1','title',title),el('p','subtitle',subtitle))}
 function render(data){const d=data.design||{};document.body.style.fontFamily=d.font==='mono'?"Consolas,monospace":d.font==='round'?"'Trebuchet MS',Verdana,sans-serif":"system-ui,Arial,sans-serif";document.getElementById('widget').style.borderRadius=(Number.isFinite(+d.radius)?Math.max(0,Math.min(28,+d.radius)):24)+'px';clear();const spinning=data.status==='spinning',winner=data.status==='winner',name=String(data.game?.name||'Игра').slice(0,180);const mystery=!!data.round?.mystery;
  if(widget==='spin'){
    if(spinning){const frame=el('div','spin-visual');frame.append(el('div','disc'),el('h1','title',mystery?'СЕКРЕТНЫЙ ВЫБОР':'ВЫБИРАЕМ ИГРУ…'));append(frame)}
    else if(winner)heading(name,'★ ИГРА ВЫБРАНА');else heading('РУЛЕТКА ГОТОВА','Выбери игры и нажми «Вращать!»');
  }else if(widget==='result'){
    if(winner){const card=el('div','card-body'),img=el('img','cover');img.alt='Обложка игры';const src=String(data.game?.image||'');try{const u=new URL(src);img.src=u.protocol==='https:'&&(/(^|\.)steamstatic\.com$/.test(u.hostname)||/(^|\.)akamaihd\.net$/.test(u.hostname))?src:'/static/favicon.svg'}catch{img.src='/static/favicon.svg'}img.onerror=()=>{img.onerror=null;img.src='/static/favicon.svg'};const body=el('div');body.append(el('div','subtitle','★ ВЫПАЛА ИГРА'),el('h1','title result-name',name));card.append(img,body);append(card)}else heading('ЖДЁМ РЕЗУЛЬТАТ', 'Игра появится после окончания вращения');
  }else if(widget==='triple'){
    if(winner&&data.round?.triple){heading(name,'✧ ТРОЙНОЙ РАНДОМАЙЗЕР');const grid=el('div','split');for(const [label,value] of [['ПРАВИЛО',data.round.rule],['ИСПЫТАНИЕ',data.round.challenge]]){const box=el('div','block');box.append(el('small','',label),el('strong','',String(value||'—').slice(0,150)));grid.append(box)}append(grid)}else heading('ТРОЙНОЙ ВЫБОР', 'Включи «Тройной рандомайзер» и запусти рулетку');
  }else if(widget==='timer'){
    const time=spinning?Math.max(0,Math.ceil((Number(data.updated||0)*1000+Number(data.duration||0)-Date.now())/1000)):0;heading(spinning?'ДО РЕЗУЛЬТАТА':'ТАЙМЕР РУЛЕТКИ',spinning?'ВРАЩЕНИЕ ИДЁТ':'ОЖИДАНИЕ');const clock=el('div','clock',time);clock.id='clock';append(clock);const bar=el('div','progress'),fill=el('i');fill.style.width=spinning?String(Math.max(0,Math.min(100,100*(1-time/Math.max(1,Math.ceil(Number(data.duration||0)/1000))))))+'%':'0%';bar.append(fill);append(bar);
  }else if(widget==='history'){
    heading('ПОСЛЕДНИЕ ИГРЫ','ИСТОРИЯ ВЫПАДЕНИЙ');const names=Array.isArray(data.history)?data.history.slice(0,6):[];if(names.length){const list=el('ol','history');names.forEach((x,i)=>{const li=el('li');li.append(el('b','',String(i+1).padStart(2,'0')),el('span','',String(x).slice(0,180)));list.append(li)});append(list)}else append(el('p','subtitle','Пока нет выпадений'));
  }else if(widget==='vote'){
    heading('ГОЛОСОВАНИЕ',data.votes?.active?'● ЗРИТЕЛИ ГОЛОСУЮТ':'РЕЗУЛЬТАТЫ ГОЛОСОВАНИЯ');const v=data.votes||{},games=Array.isArray(v.games)?v.games:[],counts=Array.isArray(v.counts)?v.counts:[];
    if(!games.length)append(el('p','subtitle','Запусти голосование во вкладке «Для авторов»'));
    else{const box=el('div','votes'),max=Math.max(1,...counts);games.forEach((g,i)=>{const row=el('div','vote'),label=el('label');label.append(el('span','',String(g).slice(0,100)),el('b','',Number(counts[i]||0)+' голосов'));const track=el('div','vote-track'),fill=el('i');fill.style.width=(Math.max(0,Number(counts[i]||0))/max*100)+'%';track.append(fill);row.append(label,track);box.append(row)});append(box,el('p','note','Проголосовало: '+Number(v.voters||0))}
  }
 }
 let last='';let inFlight=false;let latest={status:'idle'};
 async function poll(){if(inFlight||!valid||preview)return;inFlight=true;try{const r=await fetch('/api/stream/'+encodeURIComponent(room),{cache:'no-store'});if(!r.ok)throw Error('offline');const data=await r.json();const token=JSON.stringify(data);if(token!==last || widget==='timer'&&latest.status==='spinning'){last=token;latest=data;render(data)}}catch{}finally{inFlight=false}}
 if(preview){render({status:'winner',game:{name:'ДЕМОНСТРАЦИЯ ОВЕРЛЕЯ'},round:{triple:true,rule:'Без быстрого перемещения',challenge:'Найти секретный предмет'},history:['Пример игры 1','Пример игры 2'],votes:{games:['Пример 1','Пример 2'],counts:[7,12],voters:19,active:true}})}
 else if(valid){render({status:'idle'});poll();setInterval(poll,widget==='timer'?250:900)}
 else heading('НЕТ ССЫЛКИ OBS','Получить её можно в разделе «Для авторов» → Виджеты');
})();
</script></body></html>
